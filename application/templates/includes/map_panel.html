<div class="card-panel map-panel">
  <div class="panel-header-row">
    <div>
      <h3 class="panel-title">Spatial price intelligence</h3>
      <p class="panel-subtitle">
        Interactive view of MRT access, amenities and predicted resale prices.
      </p>
    </div>

    <div class="map-toggles">
      <label><input type="checkbox" id="toggle-mrt" checked> MRT</label>
      <label><input type="checkbox" id="toggle-amenities" checked> Amenities</label>
      <label><input type="checkbox" id="toggle-predictions" checked> Predictions</label>
    </div>
  </div>

  <div id="map" class="map-canvas"></div>
</div>
